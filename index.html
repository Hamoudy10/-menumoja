<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="MenuMoja — The smartest menu your restaurant will ever have. QR menus, AI assistant, M-Pesa ordering & payments for Mombasa restaurants." />
    <meta name="theme-color" content="#0A1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=yes" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"

  <body>
    <div id="root"></div>
    <noscript>MenuMoja requires JavaScript to run. Please enable JavaScript in your browser.</noscript>
    <script>
      if ('serviceWorker' in navigator) {
        caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); });
        navigator.serviceWorker.getRegistrations().then(function(r) { r.forEach(function(s) { s.unregister(); }); });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

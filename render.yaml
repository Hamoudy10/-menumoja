services:
  - type: web
    name: menumoja-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    repo: https://github.com/YOUR_USERNAME/menu-moja
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://menumoja.vercel.app
      - key: API_URL
        value: https://menumoja-backend.onrender.com
      # Set these as "Secret Files" or "Environment Variables" in Render dashboard:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
